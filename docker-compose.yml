services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app}"]
      interval: 5s
      timeout: 3s
      retries: 10

  chroma:
    image: chromadb/chroma:1.5.9 # same version as the Python client in uv.lock
    ports:
      - "8001:8000" # 8001 on host, so it won't clash with the backend on 8000
    volumes:
      - chroma_data:/data

  backend:
    build: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@db:5432/${POSTGRES_DB:-app}
      CHROMA_HOST: chroma
      CHROMA_PORT: 8000
      UPLOAD_DIR: /app/data/uploads
    ports:
      - "8000:8000"
    volumes:
      - backend_data:/app/data
      - questionnaires:/app/data/questionnaires
    depends_on:
      db:
        condition: service_healthy
      chroma:
        condition: service_started

volumes:
  pgdata:
  backend_data:
  chroma_data:
  questionnaires:
